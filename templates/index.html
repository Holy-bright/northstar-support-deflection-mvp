<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Northstar Support</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; }
    #chat-container { width: 420px; background: #fff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; }
    #chat-header { background: #1a73e8; color: #fff; padding: 16px; font-size: 1rem; font-weight: 600; }
    #messages { flex: 1; padding: 16px; overflow-y: auto; max-height: 420px; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 80%; padding: 10px 14px; border-radius: 18px; font-size: 0.9rem; line-height: 1.4; white-space: pre-wrap; }
    .bot { background: #f1f3f4; align-self: flex-start; border-bottom-left-radius: 4px; }
    .user { background: #1a73e8; color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
    #input-row { display: flex; border-top: 1px solid #e0e0e0; padding: 10px; gap: 8px; }
    #user-input { flex: 1; border: 1px solid #ddd; border-radius: 20px; padding: 8px 14px; font-size: 0.9rem; outline: none; }
    #send-btn { background: #1a73e8; color: #fff; border: none; border-radius: 20px; padding: 8px 18px; cursor: pointer; font-size: 0.9rem; }
    #send-btn:hover { background: #1558b0; }
  </style>
</head>
<body>
  <div id="chat-container">
    <div id="chat-header">🛍️ Northstar Support</div>
    <div id="messages">
      <div class="msg bot">Hi! I'm the Northstar Support Bot 👋

I can help you with:

1. 📦 Order status
   Enter your order number, e.g. NS1002

2. 🔄 Returns &amp; refunds
   Ask me about returning an item or getting a refund.

What can I help you with?</div>
    </div>
    <div id="input-row">
      <input id="user-input" type="text" placeholder="Type a message..." autocomplete="off" />
      <button id="send-btn">Send</button>
    </div>
  </div>

  <script>
    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");

    function addMessage(text, role) {
      const div = document.createElement("div");
      div.className = `msg ${role}`;
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;
      addMessage(text, "user");
      inputEl.value = "";
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text })
      });
      const data = await res.json();
      addMessage(data.reply, "bot");
    }

    sendBtn.addEventListener("click", sendMessage);
    inputEl.addEventListener("keydown", e => { if (e.key === "Enter") sendMessage(); });
  </script>
</body>
</html>
